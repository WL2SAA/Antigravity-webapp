<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%" style="display:block;background:#ffffff;font-family:'Google Sans',system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Card 1: 32x -->
    <g transform="translate(10, 0)">
      <rect width="288" height="186" rx="14" fill="#F8F9FA" stroke="#1E293B" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="144" y="60" text-anchor="middle" fill="#2563EB" font-size="36" font-weight="800">32×</text>
      <text x="144" y="112" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">Speedup on GeMV benchmarks</text>
      <text x="144" y="136" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">over highly-tuned baselines</text>
    </g>

    <!-- Card 2: Upstream -->
    <g transform="translate(324, 0)">
      <rect width="288" height="186" rx="14" fill="#F8F9FA" stroke="#1E293B" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="144" y="60" text-anchor="middle" fill="#16A34A" font-size="34" font-weight="800">Upstream</text>
      <text x="144" y="104" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">Contribution landed in the</text>
      <text x="144" y="126" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">Eigen library, accepted by</text>
      <text x="144" y="148" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">maintainers</text>
    </g>

    <!-- Card 3: 10x -->
    <g transform="translate(638, 0)">
      <rect width="288" height="186" rx="14" fill="#F8F9FA" stroke="#1E293B" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="144" y="60" text-anchor="middle" fill="#2563EB" font-size="36" font-weight="800">10×</text>
      <text x="144" y="112" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">additional speedup from</text>
      <text x="144" y="136" text-anchor="middle" fill="#334155" font-size="12.5" font-weight="500">inspired changes</text>
    </g>
  </g>
</svg>